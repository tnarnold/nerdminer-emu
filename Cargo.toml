[package]
name = "nerdminer-emu"
version = "0.2.0"
edition = "2024"
description = "Emulador desktop do NerdMiner (minerador solo de Bitcoin) com bandeja e controle de CPU/GPU"
license = "MIT"
repository = "https://github.com/tnarnold/nerdminer-emu"

[dependencies]
bytemuck = "1.25.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tray-icon = { version = "0.26.1", default-features = false }
ureq = "3.5.1"
wgpu = "30.0.1"

# Linux: tray via StatusNotifierItem (D-Bus), no GTK main loop needed alongside winit.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
